<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quote of the Day</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  
  <h2>Quote of the Day</h2>

  <!-- Task 1: Add an aria-live region here -->
  <div id="quoteStatus" aria-live="polite"></div>

  <button id="get-quote">Get New Quote</button>
  <button id="clear-quote">Clear</button>
  <button id="open-modal">Open Modal</button>
  <!-- Task 4: Convert this into a listbox later if needed -->
  <p id="quote-output">Click the button to load a quote. </p>

  <!-- Task 3: Add your modal markup here -->
  <!-- role="dialog" → identifies modal purpose
  aria-modal="true" → tells screen readers background is inactive
  aria-labelledby="modal-title" → connects heading to modal announcement
  hidden → controls visibility accessibly -->
  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
  <h2 id="modal-title">Modal Title</h2>

  <p>This is a modal dialog.</p>

  <button id="close-modal">Close</button>
  </div>
  <!-- Task 2: Add your custom keyboard-accessible button here -->
  <div id="refreshBtn" role="button" tabindex="0" aria-label="Refresh content">🔁</div>
        
</body>
</html>
